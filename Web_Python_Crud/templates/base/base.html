<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Language" content="es">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Web Crud Django{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Cargar el tag static -->
     {% load static %}
    <link rel="stylesheet" href="{% static '/css/style_base.css'%}">
</head>
<body>
    <!-- Encabezado común -->
    <header>
        <nav>
            <ul>
                <li><a href="{% url 'login' %}">Inicio</a></li>
                <li><a href="{% url 'login' %}">Login</a></li>
                <li><a href="{% url 'registro' %}">Registro</a></li>
                <li><a href="{% url 'nosotros' %}">Nosotros</a></li>
                <li><a href="">Contacto</a></li>

            </ul>
        </nav>
    </header>

    <!-- Contenido principal específico de cada página -->
    <main id="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Pie de página común -->
    <footer>
        <p>Síguenos en nuestras redes sociales:</p>
        <article class="social-icons">
            <a href="https://www.facebook.com" target="_blank" class="social-icon">
                <i class="fab fa-facebook"></i> Facebook
            </a>
            <a href="https://www.x.com" target="_blank" class="social-icon">
                <i class="fab fa-x"></i> X
            </a>
            <a href="https://www.instagram.com" target="_blank" class="social-icon">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="https://www.linkedin.com" target="_blank" class="social-icon">
                <i class="fab fa-linkedin"></i> LinkedIn
            </a>
        </article>
        <p>© 2025 - Todos los derechos reservados</p> 
    </footer>
</body>
</html>
